# FitChef 全栈部署
# 启动: docker compose up -d
# 查看: docker compose logs -f
# 停止: docker compose down

services:
  # ════════════════════════════════════════════════════════
  # MySQL 数据库
  # ════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: fitchef-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: my_project1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ════════════════════════════════════════════════════════
  # Milvus 向量数据库
  # ════════════════════════════════════════════════════════
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: fitchef-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: fitchef-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.0
    container_name: fitchef-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    command: milvus run standalone

  # ════════════════════════════════════════════════════════
  # LangFuse 可观测性
  # ════════════════════════════════════════════════════════
  langfuse-db:
    image: postgres:16-alpine
    container_name: fitchef-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: fitchef-langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: fitchef-langfuse-secret
      SALT: fitchef-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

  # ════════════════════════════════════════════════════════
  # Reranker 微服务（Cross-Encoder，HTTP API）
  # 模型从本地挂载，不在主进程内加载
  # ════════════════════════════════════════════════════════
  reranker:
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
    container_name: fitchef-reranker
    ports:
      - "8001:8001"
    volumes:
      - C:/Users/吴文佳/.cache/modelscope/hub/models/BAAI/bge-reranker-v2-m3:/model:ro
    environment:
      MODEL_PATH: /model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # # ════════════════════════════════════════════════════════
  # # FastAPI 后端 (手动启动: python run.py)
  # # ════════════════════════════════════════════════════════
  # # ════════════════════════════════════════════════════════
  # # Vue 3 前端 (手动启动: cd frontend && npm run dev)
  # # ════════════════════════════════════════════════════════

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  langfuse_pg:
