# FitChef 全栈部署
# 启动: docker compose up -d
# 查看: docker compose logs -f
# 停止: docker compose down

services:
  # ════════════════════════════════════════════════════════
  # MySQL 数据库
  # ════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: fitchef-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: my_project1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ════════════════════════════════════════════════════════
  # Milvus 向量数据库
  # ════════════════════════════════════════════════════════
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: fitchef-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: fitchef-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.0
    container_name: fitchef-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    command: milvus run standalone

  # ════════════════════════════════════════════════════════
  # LangFuse 可观测性
  # ════════════════════════════════════════════════════════
  langfuse-db:
    image: postgres:16-alpine
    container_name: fitchef-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: fitchef-langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: fitchef-langfuse-secret
      SALT: fitchef-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

  # ════════════════════════════════════════════════════════
  # FastAPI 后端
  # ════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fitchef-backend
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: my_project1
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-fitchef_knowledge}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      EMBEDDING_TYPE: ollama
      EMBEDDING_MODEL: bge-m3
      RAG_TOP_K: 5
      RAG_USE_RERANK: "${RAG_USE_RERANK:-True}"
      RAG_USE_QUERY_REWRITE: "${RAG_USE_QUERY_REWRITE:-True}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse:3000
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./indexes:/app/indexes
      - ./logs:/app/logs
      - C:/Users/吴文佳/.cache/huggingface:/root/.cache/huggingface
      - C:/Users/吴文佳/.cache/modelscope/hub/models/BAAI/bge-reranker-v2-m3:/app/models/reranker:ro
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ════════════════════════════════════════════════════════
  # Vue 3 前端
  # ════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fitchef-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  langfuse_pg:
  hf_cache:
